<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 智能体</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .chat-card {
      width: 100%;
      max-width: 720px;
      height: min(88vh, 820px);
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 顶部 */
    .chat-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .chat-header .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .chat-header .info h1 { font-size: 17px; font-weight: 600; }
    .chat-header .info p { font-size: 12px; opacity: 0.9; margin-top: 2px; }

    /* 消息区 */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      background: #f7f8fc;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg { display: flex; gap: 10px; max-width: 82%; }

    .msg .bubble-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .msg.bot .bubble-avatar { background: #ecefff; color: #667eea; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.user .bubble-avatar { background: #667eea; color: #fff; }

    .bubble {
      padding: 11px 15px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.bot .bubble {
      background: #fff;
      color: #333;
      border: 1px solid #eceef7;
      border-top-left-radius: 4px;
    }

    .msg.user .bubble {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border-top-right-radius: 4px;
    }

    .bubble.error { background: #fff1f0; color: #cf1322; border-color: #ffccc7; }

    .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%;
      background: #b4bdf3;
      animation: blink 1.2s infinite ease-in-out both;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }

    /* 输入区 */
    .input-bar {
      flex-shrink: 0;
      padding: 14px 16px;
      border-top: 1px solid #eee;
      background: #fff;
      display: flex;
      gap: 10px;
    }

    .input-bar textarea {
      flex: 1;
      resize: none;
      border: 1px solid #dfe3f5;
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      max-height: 120px;
      line-height: 1.5;
      transition: border-color 0.2s;
    }
    .input-bar textarea:focus { border-color: #667eea; }

    .send-btn {
      align-self: flex-end;
      border: none;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 0 22px;
      height: 44px;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .welcome { text-align: center; color: #99a; font-size: 14px; margin: auto; line-height: 2; }

    /* 推荐问题 */
    .suggests { display: flex; flex-direction: column; gap: 8px; align-self: flex-start; }
    .suggest-chip {
      border: 1px solid #dfe3f5;
      background: #fff;
      color: #667eea;
      border-radius: 12px;
      padding: 9px 14px;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      line-height: 1.5;
      transition: background 0.15s, border-color 0.15s;
    }
    .suggest-chip:hover { background: #f0f2ff; border-color: #b9c2f2; }

    /* 图片消息 */
    .bubble img.chat-img {
      max-width: 200px;
      max-height: 200px;
      border-radius: 8px;
      display: block;
      margin-top: 6px;
      cursor: pointer;
    }

    .img-preview-bar {
      display: none;
      padding: 10px 16px 0;
      background: #fff;
      border-top: 1px solid #eee;
    }
    .img-preview-bar.show { display: block; }

    .img-preview {
      position: relative;
      display: inline-block;
    }
    .img-preview img {
      height: 64px;
      border-radius: 8px;
      border: 1px solid #dfe3f5;
    }
    .img-preview .remove-img {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: none;
      background: #667eea;
      color: #fff;
      font-size: 13px;
      line-height: 20px;
      cursor: pointer;
      padding: 0;
    }

    .attach-btn {
      align-self: flex-end;
      border: 1px solid #dfe3f5;
      background: #fff;
      color: #667eea;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      font-size: 20px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .attach-btn:hover { background: #f0f2ff; }
  </style>
</head>
<body>
  <div class="chat-card">
    <div class="chat-header">
      <div class="avatar">🤖</div>
      <div class="info">
        <h1 id="botName">我的智能体</h1>
        <p>由扣子(Coze)驱动 · 后端安全代理模式</p>
      </div>
    </div>

    <div id="messages" class="messages">
      <div class="welcome">加载中…</div>
    </div>

    <div id="imgPreviewBar" class="img-preview-bar">
      <div class="img-preview">
        <img id="imgPreview" alt="预览">
        <button class="remove-img" id="removeImgBtn" title="移除">×</button>
      </div>
    </div>

    <div class="input-bar">
      <input type="file" id="fileInput" accept="image/*" hidden>
      <button id="attachBtn" class="attach-btn" title="发送图片">📷</button>
      <textarea id="input" rows="1" placeholder="输入消息，Enter 发送 / Shift+Enter 换行"></textarea>
      <button id="sendBtn" class="send-btn">发送</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');

    // 只存对话内容，token 在服务端，前端完全不接触
    const history = [];
    let sending = false;

    // 每个浏览器访客生成一个固定 ID（localStorage 持久化），
    // 后端透传给扣子，用于隔离不同访客的会话记忆
    function getUserId() {
      let uid = localStorage.getItem('coze_user_id');
      if (!uid) {
        uid = 'u_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
        localStorage.setItem('coze_user_id', uid);
      }
      return uid;
    }
    const userId = getUserId();

    // 页面加载时拉取智能体的开场白和推荐问题
    async function loadConfig() {
      try {
        const resp = await fetch('/api/config');
        const cfg = await resp.json();
        if (!resp.ok) throw new Error(cfg.error || '加载失败');

        if (cfg.name) {
          document.getElementById('botName').textContent = cfg.name;
          document.title = cfg.name;
        }

        const welcome = messagesEl.querySelector('.welcome');
        if (welcome) welcome.remove();

        // 开场白
        if (cfg.prologue) {
          addMessage('bot', cfg.prologue);
        } else {
          addMessage('bot', '👋 你好，有什么可以帮你的？');
        }

        // 推荐问题（点击直接发送）
        if (cfg.suggested_questions && cfg.suggested_questions.length) {
          const box = document.createElement('div');
          box.className = 'suggests';
          box.id = 'suggestBox';
          cfg.suggested_questions.forEach(q => {
            const chip = document.createElement('button');
            chip.className = 'suggest-chip';
            chip.textContent = q;
            chip.onclick = () => {
              document.getElementById('suggestBox')?.remove();
              inputEl.value = q;
              send();
            };
            box.appendChild(chip);
          });
          messagesEl.appendChild(box);
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
      } catch (e) {
        const welcome = messagesEl.querySelector('.welcome');
        if (welcome) welcome.innerHTML = '👋 你好，我是你的智能体<br>有什么可以帮你的？直接在下面输入吧';
      }
    }
    loadConfig();

    function addMessage(role, text, isError, imgUrl) {
      const welcome = messagesEl.querySelector('.welcome');
      if (welcome) welcome.remove();

      const wrap = document.createElement('div');
      wrap.className = 'msg ' + role;

      const avatar = document.createElement('div');
      avatar.className = 'bubble-avatar';
      avatar.textContent = role === 'user' ? '我' : '🤖';

      const bubble = document.createElement('div');
      bubble.className = 'bubble' + (isError ? ' error' : '');
      if (imgUrl) {
        const img = document.createElement('img');
        img.src = imgUrl;
        img.className = 'chat-img';
        img.onclick = () => window.open(imgUrl, '_blank');
        bubble.appendChild(img);
        if (text) {
          const span = document.createElement('div');
          span.textContent = text;
          bubble.appendChild(span);
        }
      } else {
        bubble.textContent = text;
      }

      wrap.appendChild(avatar);
      wrap.appendChild(bubble);
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return bubble;
    }

    function showTyping() {
      const wrap = document.createElement('div');
      wrap.className = 'msg bot';
      wrap.id = 'typingRow';
      wrap.innerHTML =
        '<div class="bubble-avatar">🤖</div>' +
        '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
      document.getElementById('typingRow')?.remove();
    }

    // ===== 图片上传 =====
    let pendingImage = null; // { file_id, previewUrl }
    let uploading = false;   // 图片是否还在上传中

    document.getElementById('attachBtn').addEventListener('click', () => {
      document.getElementById('fileInput').click();
    });

    document.getElementById('removeImgBtn').addEventListener('click', clearImage);

    function clearImage() {
      pendingImage = null;
      document.getElementById('fileInput').value = '';
      document.getElementById('imgPreviewBar').classList.remove('show');
    }

    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) { alert('只能发送图片'); return; }
      if (file.size > 20 * 1024 * 1024) { alert('图片不能超过 20MB'); return; }

      // 先读完本地图片拿到 dataURL（用于气泡内显示），读完再上传，避免发送时图片还没就绪
      let dataUrl;
      try {
        dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error('图片读取失败'));
          reader.readAsDataURL(file);
        });
      } catch (err) {
        alert(err.message);
        return;
      }
      document.getElementById('imgPreview').src = dataUrl;
      document.getElementById('imgPreviewBar').classList.add('show');

      // 上传到扣子拿 file_id
      uploading = true;
      sendBtn.textContent = '上传中…';
      try {
        const resp = await fetch('/api/upload?filename=' + encodeURIComponent(file.name), {
          method: 'POST',
          headers: { 'Content-Type': file.type },
          body: file
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || '上传失败');
        pendingImage = { file_id: data.file_id, previewUrl: dataUrl };
      } catch (err) {
        alert('图片上传失败：' + err.message);
        clearImage();
      } finally {
        uploading = false;
        sendBtn.textContent = '发送';
      }
    });

    async function send() {
      const text = inputEl.value.trim();
      if ((!text && !pendingImage) || sending) return;
      if (uploading) { alert('图片还在上传中，请稍等一秒再发送~'); return; }

      sending = true;
      sendBtn.disabled = true;
      inputEl.value = '';
      inputEl.style.height = 'auto';

      const msg = { role: 'user', content: text };
      if (pendingImage) msg.file_id = pendingImage.file_id;
      history.push(msg);
      addMessage('user', text, false, pendingImage ? pendingImage.previewUrl : null);
      clearImage();
      showTyping();

      const replyBubble = addMessage('bot', '');
      let gotAny = false;
      let hadError = false;

      try {
        const resp = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history, user_id: userId })
        });

        if (!resp.ok) {
          let msg = '请求失败（' + resp.status + '）';
          try { msg = (await resp.json()).error || msg; } catch (e) {}
          throw new Error(msg);
        }

        // 解析服务端 SSE
        const reader = resp.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const chunks = buffer.split('\n\n');
          buffer = chunks.pop();

          for (const chunk of chunks) {
            const line = chunk.split('\n').find(l => l.startsWith('data: '));
            if (!line) continue;
            const obj = JSON.parse(line.slice(6));

            if (obj.error) {
              replyBubble.classList.add('error');
              replyBubble.textContent = '⚠️ ' + obj.error;
              gotAny = true;
              hadError = true;
            } else if (obj.content) {
              removeTyping();
              replyBubble.textContent += obj.content;
              messagesEl.scrollTop = messagesEl.scrollHeight;
              gotAny = true;
            }
          }
        }

        const reply = replyBubble.textContent;
        // 错误回复不写入上下文，避免下轮把错误提示发给智能体
        if (!hadError && reply) {
          history.push({ role: 'assistant', content: reply });
        }
        if (!gotAny && !reply) replyBubble.textContent = '（没有收到回复）';
      } catch (err) {
        removeTyping();
        replyBubble.classList.add('error');
        replyBubble.textContent = '⚠️ ' + err.message;
      } finally {
        removeTyping();
        sending = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener('click', send);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    });
  </script>
</body>
</html>
